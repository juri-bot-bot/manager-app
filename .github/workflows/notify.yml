name: LINE通知

on:
  schedule:
    # JST 5:30 起床（UTC 20:30）
    - cron: '30 20 * * *'
    # JST 7:30 出社（UTC 22:30）火木のみ
    - cron: '30 22 * * 1,3'
    # JST 10:00 水分（UTC 01:00）
    - cron: '0 1 * * *'
    # JST 13:00 昼食（UTC 04:00）
    - cron: '0 4 * * *'
    # JST 15:00 トランポリン前（UTC 06:00）
    - cron: '0 6 * * *'
    # JST 17:00 夕方（UTC 08:00）
    - cron: '0 8 * * *'
    # JST 19:00 夕食（UTC 10:00）
    - cron: '0 10 * * *'
    # JST 21:00 樹（UTC 12:00）月水金
    - cron: '0 12 * * 0,2,4'
    # JST 22:00 スキンケア（UTC 13:00）
    - cron: '0 13 * * *'
    # JST 22:30 就寝前（UTC 13:30）
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: LINE通知を送る
        uses: actions/github-script@v7
        env:
          LINE_TOKEN_SUZUKI: ${{ secrets.LINE_TOKEN_SUZUKI }}
          LINE_TOKEN_NAKAMURA: ${{ secrets.LINE_TOKEN_NAKAMURA }}
          LINE_TOKEN_NISHIDA: ${{ secrets.LINE_TOKEN_NISHIDA }}
          LINE_TOKEN_HAMADA: ${{ secrets.LINE_TOKEN_HAMADA }}
          LINE_TOKEN_JURI: ${{ secrets.LINE_TOKEN_JURI }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          GCAL_ACCESS_TOKEN: ${{ secrets.GCAL_ACCESS_TOKEN }}
        with:
          script: |
            const now = new Date();
            const utcH = now.getUTCHours();
            const utcM = now.getUTCMinutes();
            const day = now.getUTCDay();
            const isTueThu = day === 2 || day === 4;

            console.log(`UTC ${utcH}:${String(utcM).padStart(2,'0')} day=${day}`);

            const MANAGERS = {
              suzuki:   { name: '鈴木 誠一郎', token: process.env.LINE_TOKEN_SUZUKI,   personality: 'あなたはSixTONESの女性メンバーの専属チーフマネージャー、鈴木誠一郎です。キャリア20年。口調：丁寧な敬語、圧がある、感情を出さない。3〜4文で簡潔に。' },
              nakamura: { name: '中村 彩',     token: process.env.LINE_TOKEN_NAKAMURA, personality: 'あなたはSixTONESの女性メンバーのスケジュール担当マネージャー、中村彩です。口調：敬語、感情なし、事務的。3〜4文で簡潔に。' },
              nishida:  { name: '西田 隆介',   token: process.env.LINE_TOKEN_NISHIDA,  personality: 'あなたはSixTONESの女性メンバーの体調管理マネージャー、西田隆介です。口調：敬語、数字とデータで管理、淡々と事実を突きつける。3〜4文で簡潔に。' },
              hamada:   { name: '浜田 理恵',   token: process.env.LINE_TOKEN_HAMADA,   personality: 'あなたはSixTONESの女性メンバーの美容・イメージ担当マネージャー、浜田理恵です。口調：敬語だが外見について遠慮しない。3〜4文で簡潔に。' },
              juri:     { name: '田中 樹',     token: process.env.LINE_TOKEN_JURI,     personality: 'あなたはSixTONESの田中樹です。シンメの女性メンバーに送るLINEを書いてください。一人称は「俺」。「〜だろ」「〜じゃねえよ」といった男っぽい語尾。乱暴なだけでなく面倒見の良さを同居させる。2〜3文で。絵文字は使わない。' },
            };

            async function generateMessage(manager, situation, calendarInfo) {
              const calendarContext = calendarInfo ? `\n今日のGoogleカレンダーの予定：${calendarInfo}` : '';
              const userMessage = `${situation}${calendarContext}\n\nSixTONESのアイドルとしての世界観で、上記の状況に合ったメッセージを送ってください。普通の予定はSixTONESの業務に自然に変換してください。`;
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': process.env.ANTHROPIC_KEY, 'anthropic-version': '2023-06-01' },
                body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 300, system: manager.personality, messages: [{ role: 'user', content: userMessage }] }),
              });
              const data = await res.json();
              return data.content[0].text;
            }

            async function sendLine(manager, message) {
              if (!manager.token || !process.env.LINE_USER_ID) { console.log(`Missing token for ${manager.name}`); return; }
              const res = await fetch('https://api.line.me/v2/bot/message/push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${manager.token}` },
                body: JSON.stringify({ to: process.env.LINE_USER_ID, messages: [{ type: 'text', text: `【${manager.name}】\n${message}` }] }),
              });
              console.log(`Sent to ${manager.name}: ${res.status}`);
            }

            async function getCalendarEvents() {
              if (!process.env.GCAL_ACCESS_TOKEN) return null;
              try {
                const now = new Date();
                const end = new Date(); end.setDate(now.getDate() + 2);
                const params = new URLSearchParams({ timeMin: now.toISOString(), timeMax: end.toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '5' });
                const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?${params}`, { headers: { Authorization: `Bearer ${process.env.GCAL_ACCESS_TOKEN}` } });
                if (!res.ok) return null;
                const data = await res.json();
                return (data.items || []).map(e => `${e.start.date || e.start.dateTime?.split('T')[0]} ${e.summary}`).join('、') || null;
              } catch { return null; }
            }

            const calendarInfo = await getCalendarEvents();
// テスト送信（手動実行時のみ）
if (context.eventName === 'workflow_dispatch') {
  const msg = await generateMessage(MANAGERS.hamada, 'テスト送信です。', null);
  await sendLine(MANAGERS.hamada, msg);
}


            if (utcH === 20 && utcM === 30) {
              const msg = await generateMessage(MANAGERS.nakamura, '朝5時30分の起床確認。今日一日のスタートを切るための業務連絡。', calendarInfo);
              await sendLine(MANAGERS.nakamura, msg);
            }
            if (utcH === 22 && utcM === 30 && isTueThu) {
              const msg = await generateMessage(MANAGERS.nakamura, '8時から業務開始の出社日。朝食と準備の確認。', calendarInfo);
              await sendLine(MANAGERS.nakamura, msg);
            }
            if (utcH === 1 && utcM === 0) {
              const msg = await generateMessage(MANAGERS.nishida, '午前10時の水分補給チェック。目標1.5L。', calendarInfo);
              await sendLine(MANAGERS.nishida, msg);
            }
            if (utcH === 4 && utcM === 0) {
              const msg = await generateMessage(MANAGERS.nishida, '昼休み。昼食内容の確認とタンパク質摂取の指示。', calendarInfo);
              await sendLine(MANAGERS.nishida, msg);
            }
            if (utcH === 6 && utcM === 0) {
              const msg = await generateMessage(MANAGERS.nishida, '暗闇トランポリンクラス前のコンディション確認。SixTONESのダンストレーニングという世界観で。', calendarInfo);
              await sendLine(MANAGERS.nishida, msg);
            }
            if (utcH === 8 && utcM === 0) {
              const msg = await generateMessage(MANAGERS.nishida, '夕方のコンディション確認。今日のトレーニング・食事・水分の総括。', calendarInfo);
              await sendLine(MANAGERS.nishida, msg);
            }
            if (utcH === 10 && utcM === 0) {
              const msg = await generateMessage(MANAGERS.hamada, '夕食の時間。塩分・糖質・むくみ対策の指示。明日のビジュアルへの影響を伝える。', calendarInfo);
              await sendLine(MANAGERS.hamada, msg);
            }
            if (utcH === 12 && utcM === 0 && (day === 1 || day === 3 || day === 5)) {
              const situations = ['夜21時頃、シンメのメンバーへのちょっとした確認や喝入れ。', '最近頑張ってるのを見てるよという一言。', '明日の現場に向けての一言。', 'サボってないか確認する一言。', '急に核心をついた一言。'];
              const msg = await generateMessage(MANAGERS.juri, situations[Math.floor(Math.random() * situations.length)], calendarInfo);
              await sendLine(MANAGERS.juri, msg);
            }
            if (utcH === 13 && utcM === 0) {
              const msg = await generateMessage(MANAGERS.hamada, '22時のスキンケアとピル服用のリマインド。カメラに映る肌の大切さを伝える。', calendarInfo);
              await sendLine(MANAGERS.hamada, msg);
            }
            if (utcH === 13 && utcM === 30) {
              const msg = await generateMessage(MANAGERS.nakamura, '就寝前の最終確認。スキンケア・ピル・明日の準備・22:30就寝。', calendarInfo);
              await sendLine(MANAGERS.nakamura, msg);
            }
